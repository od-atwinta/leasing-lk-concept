<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<title>Личный кабинет лизингополучателя — концепт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#22384D; --navy2:#1A2C3D; --ink:#34495E; --blue:#2F6F9F; --blue2:#255A82; --sky:#78A9CC; --pale:#EDF4F8; --pale2:#F6F9FB;
  --line:#D5E1EA; --grey:#6B7A89; --bg:#F3F6F9; --white:#fff; --ok:#2E8B57; --okbg:#E7F4EC; --warn:#C77A12; --warnbg:#FDF3E3; --bad:#C0392B; --badbg:#FBEAE8;
  --r:12px; --sh:0 1px 2px rgba(34,56,77,.06),0 4px 16px rgba(34,56,77,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
a{color:var(--blue);text-decoration:none;cursor:pointer}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
h3{font-size:14px;margin:0 0 8px;color:var(--navy)}
.muted{color:var(--grey)} .small{font-size:12px} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- ВХОД: полноэкранная анимация ---------- */
.auth{position:fixed;inset:0;background:radial-gradient(120% 90% at 20% 10%,#2A4760 0%,var(--navy) 45%,var(--navy2) 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
.auth svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.auth svg.paths path{fill:none;stroke-linecap:round;animation-name:flow;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes flow{
  0%{stroke-dasharray:.3 1;stroke-dashoffset:0;opacity:.3}
  50%{stroke-dasharray:1 0;stroke-dashoffset:-1;opacity:.6}
  100%{stroke-dasharray:.3 1;stroke-dashoffset:0;opacity:.3}
}
@media (prefers-reduced-motion:reduce){.auth svg.paths path{animation:none;opacity:.45}}
.auth-card{position:relative;z-index:2;width:100%;max-width:430px;background:rgba(255,255,255,.97);border-radius:18px;padding:30px 30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.brand .t{font-size:15px}
.brand .s{font-size:10.5px;font-weight:500;color:var(--grey);letter-spacing:.02em}
.auth-tabs{display:flex;gap:4px;background:var(--pale);border-radius:10px;padding:4px;margin:20px 0 18px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--grey)}
.auth-tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.auth-hero{position:absolute;left:5vw;bottom:6vh;z-index:1;color:#fff;max-width:520px}
.auth-hero h2{color:#fff;font-size:28px;line-height:1.2;margin:0 0 10px}
.auth-hero p{color:#BFD6E8;margin:0}
@media (max-width:1100px){.auth-hero{display:none}}
@media (min-width:1101px){.auth{justify-content:flex-end;padding-right:9vw}.auth-hero{top:50%;bottom:auto;transform:translateY(-50%);left:7vw;max-width:460px}.auth-hero h2{font-size:34px}}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--blue)}

/* ---------- ФОРМЫ ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.inp,.sel,textarea.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;outline:none;transition:border .15s}
.inp:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,159,.12)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:8px 0}
.chk input{margin-top:3px}
.hint{background:var(--pale);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--ink);margin:10px 0}
.err{background:var(--badbg);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:12.5px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;background:var(--blue);color:#fff;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}.btn.sec:hover{background:var(--pale2)}
.btn.ghost{background:transparent;color:var(--blue);padding:6px 8px}.btn.ghost:hover{background:var(--pale)}
.btn.danger{background:#fff;color:var(--bad);border-color:#EBC5C0}
.btn.block{width:100%}.btn.sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(47,111,159,.25);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- КАРКАС ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--navy);color:#DCE8F2;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.side svg.paths{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.side .in{position:relative;display:flex;flex-direction:column;height:100%;padding:18px 12px}
.side .brand{color:#fff;padding:0 8px 16px}.side .brand .s{color:#9FBBD3}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#DCE8F2;font-weight:500;font-size:13.5px;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(120,169,204,.22);color:#fff;font-weight:600}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .cnt{margin-left:auto;background:var(--sky);color:var(--navy);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.mgr{margin-top:auto;background:rgba(255,255,255,.07);border-radius:11px;padding:12px;font-size:12px}
.mgr b{color:#fff;display:block;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(243,246,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 26px}
.top .ttl{font-weight:700;color:var(--navy);font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad)}.dot.busy{background:var(--warn);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.ib svg{width:18px;height:18px}
.ib .badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:17px;text-align:center}
.user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:10px}
.user:hover{background:#fff}
.ava{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.user .nm{font-size:12.5px;font-weight:600;color:var(--navy);line-height:1.2}.user .rl{font-size:11px;color:var(--grey)}
.content{padding:24px 26px 90px;max-width:1280px;width:100%}
.burger{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .burger{display:flex}
  .top{padding:10px 14px}.content{padding:16px 14px 90px}
  .user .txt,.sync .lbl{display:none}
}

/* ---------- КОМПОНЕНТЫ ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card.pad0{padding:0}
.kpi .l{font-size:12px;color:var(--grey);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin:6px 0 2px}
.kpi .d{font-size:12px;color:var(--grey)}
.kpi .v.bad{color:var(--bad)} .kpi .v.ok{color:var(--ok)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hd .sp{flex:1}
.crumbs{font-size:12px;color:var(--grey);margin-bottom:6px}.crumbs a{color:var(--grey)}.crumbs a:hover{color:var(--blue)}
.alert{display:flex;gap:12px;align-items:center;border-radius:11px;padding:12px 16px;margin-bottom:12px;font-size:13px}
.alert.warn{background:var(--warnbg);color:#7A4A06}.alert.bad{background:var(--badbg);color:#7C241B}.alert.info{background:var(--pale);color:var(--navy)}.alert.ok{background:var(--okbg);color:#1F5E3A}
.alert .sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 9px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.info{background:var(--pale);color:var(--blue)}.tag.grey{background:#EEF1F4;color:var(--grey)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--grey);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--navy);border-color:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--grey);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--pale2);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid #EDF2F6;vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--pale2)}
table.t td.r,table.t th.r{text-align:right}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px}
.kv .k{font-size:11.5px;color:var(--grey)}.kv .v{font-weight:600;color:var(--navy);margin-top:2px}
.prog{height:8px;background:var(--pale);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:8px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EDF2F6}
.list .it:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--pale);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.qa{grid-template-columns:1fr 1fr}}
.qa button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--navy);font-weight:600;font-size:13px;transition:border .15s,box-shadow .15s}
.qa button:hover{border-color:var(--sky);box-shadow:var(--sh)}
.qa button span{font-weight:400;font-size:11.5px;color:var(--grey)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .inp,.filters .sel{width:auto;min-width:150px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--grey)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{padding:34px;text-align:center;color:var(--grey)}
.tl{position:relative;padding-left:22px}
.tl .st{position:relative;padding:0 0 16px}
.tl .st:before{content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl .st:after{content:"";position:absolute;left:-13px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child:after{display:none}
.tl .st.done:before{background:var(--ok)}.tl .st.cur:before{background:var(--warn);animation:pl 1s infinite}
.tl .st b{color:var(--navy);font-size:13px}
/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--grey);font-weight:600;text-align:center;padding:4px 0}
.cal .d{min-height:78px;background:#fff;border:1px solid #E6EDF3;border-radius:9px;padding:6px;font-size:11.5px}
.cal .d.o{background:transparent;border-color:transparent}
.cal .d.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cal .d .n{font-weight:600;color:var(--grey);margin-bottom:4px}
.cal .p{display:block;border-radius:6px;padding:2px 5px;margin-bottom:3px;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .p.paid{background:var(--okbg);color:var(--ok)}.cal .p.due{background:var(--pale);color:var(--blue)}.cal .p.over{background:var(--badbg);color:var(--bad)}
@media (max-width:640px){.cal .d{min-height:52px}.cal .p{font-size:0;height:6px;padding:0}}
/* модалка / тосты */
.ov{position:fixed;inset:0;background:rgba(26,44,61,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal .mh{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;flex:1}
.modal .mb{padding:20px 22px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;color:var(--grey);line-height:1}
.toasts{position:fixed;right:18px;top:74px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--navy);color:#fff;border-radius:11px;padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease}
.toast b{display:block;margin-bottom:2px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
/* документ */
.doc{border:1px solid var(--line);border-radius:10px;padding:22px;font-size:12px;background:#fff}
.doc h3{text-align:center;font-size:14px}
.doc table{width:100%;border-collapse:collapse;margin-top:10px}.doc td,.doc th{border:1px solid #CBD8E3;padding:5px 7px;font-size:11.5px}
.qr{width:160px;height:160px;flex:none}
/* демо-панель */
.demo{position:fixed;right:18px;bottom:18px;z-index:150;font-size:12px}
.demo .fab{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:22px;padding:8px 14px;font-weight:700;box-shadow:var(--sh);display:flex;gap:8px;align-items:center}
.demo .pn{position:absolute;bottom:46px;right:0;width:300px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:16px}
.demo .pn h3{margin-bottom:10px}
.sw{display:flex;align-items:center;gap:10px;margin:8px 0}
.tg{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;border:0;flex:none;transition:background .15s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ok)}.tg.on:after{left:19px}
.tg.off-red{background:var(--bad)}
@media (max-width:900px){.demo{right:14px;bottom:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl"></div>
<div class="toasts" id="toasts"></div>
<div class="demo" id="demo"></div>
<script>
"use strict";
/* =====================================================================
   КОНЦЕПТ ЛИЧНОГО КАБИНЕТА ЛИЗИНГОПОЛУЧАТЕЛЯ «ВОСТОК-ЛИЗИНГ»
   Все данные вымышленные. Обмен с 1С имитируется в браузере.
   ===================================================================== */
const TODAY = new Date(2026, 8, 25);          // «сегодня» в демо
const KEY = "vl-lk-demo-v1";
const VAT = 22;                                 // НДС 22% с 2026 г.

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rub = (n, sign) => (sign && n > 0 ? "+" : "") + new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2, minimumFractionDigits: n % 1 ? 2 : 0 }).format(n) + " ₽";
const d2 = d => { d = new Date(d); return d.toLocaleDateString("ru-RU"); };
const dLong = d => new Date(d).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
const tm = t => new Date(t).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const iso = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const addM = (d, m) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + m); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONTHS_G = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const uid = () => Math.random().toString(36).slice(2, 9);
const ago = t => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); if (s < 10) return "только что"; if (s < 60) return s + " сек назад"; const m = Math.round(s / 60); if (m < 60) return m + " мин назад"; return tm(t); };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; };

/* ---------- иконки ---------- */
const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h6"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  docs: '<path d="M8 3h9l3 3v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M4 7v13a1 1 0 0 0 1 1h10"/>',

function pathsSVG(animated, colorA = "#9CC4E2", colorB = "#FFFFFF", k = 1) {

  for (const [pos, col] of [[1, colorA], [-1, colorB]]) {
    for (let i = 0; i < 36; i++) {
      const d = `M-${380 - i * 5 * pos} -${189 + i * 6}C-${380 - i * 5 * pos} -${189 + i * 6} -${312 - i * 5 * pos} ${216 - i * 6} ${152 - i * 5 * pos} ${343 - i * 6}C${616 - i * 5 * pos} ${470 - i * 6} ${684 - i * 5 * pos} ${875 - i * 6} ${684 - i * 5 * pos} ${875 - i * 6}`;

      const op = (Math.min(0.1 + i * 0.03, 1) * k).toFixed(3);
      const dur = (20 + ((i * 37 + (pos > 0 ? 11 : 3)) % 100) / 10).toFixed(1);
      const delay = (-((i * 53) % 200) / 10).toFixed(1);
      out += animated
        ? `<path d="${d}" pathLength="1" stroke="${col}" stroke-width="${w}" stroke-opacity="${op}" style="animation-duration:${dur}s;animation-delay:${delay}s"/>`
        : `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-opacity="${op}"/>`;
    }
  }
  return `<svg class="paths" viewBox="0 0 696 316" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;

function buildSchedule(c) {
  const pays = [], accr = [];
  const body = c.sum - c.advance - c.buyout;
  const m = Math.round(body / c.term / 10) * 10;
  pays.push({ n: 0, date: iso(c.sign), amount: c.advance, kind: "Аванс" });
  const tr = new Date(c.transfer);
  for (let i = 1; i <= c.term; i++) {
    const dt = addM(new Date(tr.getFullYear(), tr.getMonth(), c.payDay), i);
    let a = i === c.term ? body - m * (c.term - 1) + c.buyout : m;
    pays.push({ n: i, date: iso(dt), amount: a, kind: i === c.term ? "Платёж + выкупной" : "Лизинговый платёж" });
  }
  const acc = Math.round(c.sum / c.term * 100) / 100;
  for (let i = 0; i < c.term; i++) {
    const dt = addM(new Date(tr.getFullYear(), tr.getMonth(), 1), i);
    const end = new Date(dt.getFullYear(), dt.getMonth() + 1, 0);
    accr.push({ period: iso(dt), end: iso(end), amount: acc, vat: Math.round(acc * VAT / (100 + VAT) * 100) / 100 });
  }
  return { pays, accr, monthly: m };
}

  else if (j.type === "letter") { r.result = { title: "Письмо с графиком платежей по " + (p.cid === "all" ? "всем договорам" : p.cid) }; done("Письмо с графиком платежей сформировано", "#/requests/" + r.id); }
  else if (j.type === "originals") {
    r.result = { text: p.channel === "edo" ? "Документы отправлены через " + S.company.edo.op + ". Подпишите их в своей системе ЭДО." : "Оригиналы отправлены Почтой России. Трек-номер: 80080" + String(Math.floor(Math.random() * 1e9)).padStart(9, "0") + " (демо)." };
    done("Оригиналы документов отправлены", "#/requests/" + r.id);
  } else if (j.type === "other") { r.result = { text: "Здравствуйте! Спасибо за обращение. Подготовили расчёт по вашему вопросу и приложили файл. Если останутся вопросы — позвоните мне. Екатерина Смирнова, персональный менеджер.", file: "Ответ менеджера.pdf" }; done("Персональный менеджер ответил на запрос " + r.id, "#/requests/" + r.id); }
  else if (j.type === "payment") {
    const b = S.bills.find(b => b.id === p.bid);
    S.payments.push({ id: uid(), cid: b.cid, date: iso(TODAY), amount: b.amount, doc: "п/п по счёту " + b.no });
    b.status = "Оплачен"; b.paid = true;
    done("Платёж " + rub(b.amount) + " по " + b.cid + " проведён в 1С. Сальдо обновлено.", "#/payments/saldo");
  } else if (j.type === "policy") {
    const pol = S.policies.find(x => x.id === p.pid); pol.pending = false;
    done("Новый полис " + pol.type + " по " + pol.cid + " принят", "#/insurance");
  }
}
function doSync(auto) {
  if (!S.sync.online) { toast("1С недоступна", "Показываем данные последней синхронизации. Запросы отправим автоматически, когда связь восстановится."); return; }
  S.sync.busy = true; render(true);
  setTimeout(() => { S.sync.busy = false; S.sync.last = Date.now(); save(); render(true); if (!auto) toast("Данные обновлены", "Кабинет получил изменения из 1С"); }, 1300);
}
function notify(type, text, link) { S.notes.unshift({ id: uid(), t: Date.now(), type, text, link, read: false }); }
function toast(title, text) {
  const el = document.createElement("div"); el.className = "toast"; el.innerHTML = `<b>${esc(title)}</b>${esc(text || "")}`;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), 4600);
}
function newRequest(type, title, cid, extra = {}) {
  const r = { id: "R-" + (++S.reqNo), type, title, cid, created: Date.now(), status: "work", stages: [[FLOWS[type][0][0], Date.now()]], ...extra };
  S.requests.unshift(r); startJob(type, { rid: r.id, cid, ...extra.payload });
  save(); return r;
}

function payBill(id) { const b = S.bills.find(b => b.id === id); b.status = "Платёж отправлен банком"; startJob("payment", { bid: id }); save(); render(true); toast("Платёж отправлен", "Ждём поступление в 1С — статус обновится сам"); }
function qrSVG(seed) {
  let h = 0; for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296; const N = 29; let r = "";
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#22384D"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#22384D"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const inF = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9); if (!inF && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr" viewBox="-2 -2 ${N + 4} ${N + 4}" style="margin:8px auto;display:block"><rect x="-2" y="-2" width="${N + 4}" height="${N + 4}" fill="#fff"/><g fill="#22384D">${r}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

  $("#demo").innerHTML = `${demoOpen ? `<div class="pn"><h3>Демо-режим</h3>
    <div class="sw"><button class="tg ${s.online ? "on" : "off-red"}" onclick="toggle1C()" aria-label="Связь с 1С"></button><div><b>${s.online ? "1С на связи" : "1С недоступна"}</b><div class="muted">Выключите, чтобы увидеть работу при сбое</div></div></div>
    <div class="muted" style="margin:8px 0">Заданий в очереди обмена: <b>${inQ}</b></div>
    ${S.session ? `<div class="field" style="margin-top:10px"><label>Войти как</label><div class="chips">${S.users.filter(u => u.status === "active").map(u => `<button class="chip ${S.session.uid === u.id ? "on" : ""}" onclick="S.session.uid='${u.id}';save();render()">${esc(u.role)}</button>`).join("")}</div></div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sec sm" onclick="if(confirm('Вернуть все демо-данные к исходному состоянию?')){try{localStorage.removeItem(KEY)}catch(e){};S=initialState();for(const k in sched)delete sched[k];dSel.clear();location.hash='#/login';render()}">Сбросить демо</button>${S.session ? `<button class="btn sec sm" onclick="logout()">Экран входа</button>` : ""}</div>
    <p class="muted" style="margin:10px 0 0">Все данные вымышленные. Обмен с 1С имитируется в браузере.</p></div>` : ""}
    <button class="fab" onclick="demoOpen=!demoOpen;renderDemo()"><span class="dot ${s.online ? (inQ ? "busy" : "") : "off"}"></span>Демо${inQ ? " · " + inQ : ""}</button>`;
}
function toggle1C() {
  S.sync.online = !S.sync.online; save();
  if (S.sync.online) { toast("Связь с 1С восстановлена", "Отправляем накопленные запросы и получаем изменения"); doSync(true); }
  else toast("1С недоступна", "Кабинет продолжает работать на сохранённых данных");
  render(true);
}

{ const as = new URLSearchParams(location.search).get("as"); if (as && S.users.some(u => u.id === as)) { S.session = { uid: as }; save(); } }
window.addEventListener("hashchange", () => { closeModal(); render(); });
if (!location.hash) location.hash = S.session ? "#/home" : "#/login";
